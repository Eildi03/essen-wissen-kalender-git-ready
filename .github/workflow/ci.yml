name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Abhaengigkeiten installieren
        working-directory: api
        run: npm ci

      - name: Lint und Syntaxpruefung
        working-directory: api
        run: npm run check

      - name: Abhaengigkeiten auf Schwachstellen pruefen
        working-directory: api
        run: npm audit --audit-level=high

      - name: Tests
        working-directory: api
        run: npm test

      - name: Secret-Scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  containers:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: API-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./api
          load: true
          tags: essen-wissen-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Frontend-Image bauen
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          load: true
          tags: essen-wissen-frontend:ci

      - name: Image-Scan API
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: essen-wissen-api:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Image-Scan Frontend
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: essen-wissen-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      - name: Dockerfile-Linting
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: api/Dockerfile

  smoke:
    runs-on: ubuntu-latest
    needs: containers
    steps:
      - uses: actions/checkout@v4

      - name: Stack starten
        run: |
          printf 'POSTGRES_PASSWORD=%s\nJWT_SECRET=%s\n' "$(openssl rand -hex 24)" "$(openssl rand -hex 48)" > .env
          docker compose -f compose.yaml -f compose.ci.yaml up -d --build --wait

      - name: Health pruefen
        run: |
          docker compose exec -T api node -e "fetch('http://127.0.0.1:3000/healthz').then(r => { if (!r.ok) process.exit(1); })"

      - name: Logs bei Fehler
        if: failure()
        run: docker compose logs --tail=200

      - name: Aufraeumen
        if: always()
        run: docker compose down -v