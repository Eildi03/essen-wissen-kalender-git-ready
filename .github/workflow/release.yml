name: Release und Deployment

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      api-digest: ${{ steps.api.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - id: api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/api:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/api:latest

      - uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          provenance: true
          sbom: true
          tags: |
            ghcr.io/${{ github.repository }}/frontend:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}/frontend:latest

      - uses: sigstore/cosign-installer@v3
      - name: Image signieren
        run: cosign sign --yes ghcr.io/${{ github.repository }}/api@${{ steps.api.outputs.digest }}

  deploy:
    runs-on: ubuntu-latest
    needs: publish
    environment: production
    steps:
      - name: Rollout auf dem Zielserver
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -euo pipefail
            cd /opt/essen-wissen-kalender
            git fetch --tags origin
            git checkout ${{ github.ref_name }}
            docker compose pull
            docker compose run --rm migrate
            docker compose up -d --wait --no-build
            docker compose ps