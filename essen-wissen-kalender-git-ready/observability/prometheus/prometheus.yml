global:
  scrape_interval: 15s
  evaluation_interval: 30s

scrape_configs:
  - job_name: "api"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "api:3000"   # API-Container, falls /metrics implementiert

  - job_name: "proxy"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "proxy:2019" # Beispiel für Caddy-Metriken, ggf. anpassen
  
  - job_name: "api"
    metrics_path: "/metrics"  # oder /api/v1/metrics
    static_configs:
      - targets:
          - "api:3000"

  - job_name: "nginx"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "nginx-exporter:9113"
  # Weitere Jobs (PostgreSQL-Exporter, Node-Exporter) nach Bedarf ergänzen
  - job_name: "caddy"
    metrics_path: "/metrics"
    static_configs:
      - targets:
          - "caddy-exporter:9180"