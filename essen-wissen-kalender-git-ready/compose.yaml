name: essen-wissen-kalender
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-essen_wissen}
      POSTGRES_USER: ${POSTGRES_USER:-essen_wissen_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD muss gesetzt werden}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./api/db/migrations/001_baseline.sql:/docker-entrypoint-initdb.d/001-baseline.sql:ro
      - ./api/db/migrations/002_add_sessions_table.sql:/docker-entrypoint-initdb.d/002-sessions.sql:ro
      - ./api/db/migrations/003_add_trgm_indexes.sql:/docker-entrypoint-initdb.d/003-trgm.sql:ro
      - ./api/db/migrations/004_add_roles.sql:/docker-entrypoint-initdb.d/004-roles.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    security_opt: [no-new-privileges:true]

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD muss gesetzt werden}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_COOKIE_SAMESITE: "Lax"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [backend, frontend]
    expose: ["8080"]
    security_opt: [no-new-privileges:true]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-essen_wissen}
      PGSSL: "false"
      CORS_ORIGIN: ${CORS_ORIGIN:-https://kalender.localhost}
      TRUST_PROXY: "true"
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET muss gesetzt werden}
      JWT_TTL: ${JWT_TTL:-15m}
      PG_POOL_MAX: ${PG_POOL_MAX:-10}
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend]
    expose: ["3000"]
    tmpfs: 
      - /tmp:rw,size=64m
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [frontend]
    tmpfs:
      - /tmp:rw,size=8m
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

  proxy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_started
      frontend:
        condition: service_started
    networks: [frontend, backend]
    security_opt: [no-new-privileges:true]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=15d"
    ports:
      - "127.0.0.1:9090:9090"  # optional: lokal erreichbar
    volumes:
      - ./observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - backend
      - observability
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  loki:
      image: grafana/loki:3.1.1
      container_name: loki
      restart: unless-stopped
      command:
       - "-config.file=/etc/loki/loki-config.yml"
      ports:
       - "127.0.0.1:3100:3100"  # optional: lokal erreichbar
      volumes:
       - ./observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
       - loki-data:/loki
      networks:
       - observability
      deploy:
       resources:
         limits:
           cpus: "0.5"
           memory: 256M

  grafana:
    image: grafana/grafana:11.0.0
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "http://localhost:3001"  # ggf. Proxy-URL
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3001:3000"  # Grafana im Browser
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - observability
      - backend
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
  # PROMTAIL AUSKOMMENTIERT - zu komplex für Docker Socket Mounting
  promtail:
     image: grafana/promtail:3.1.1
     container_name: promtail
     restart: unless-stopped
     command:
       - "-config.file=/etc/promtail/promtail-config.yml"
     volumes:
       - ./observability/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
       - /var/lib/docker/containers:/var/lib/docker/containers:ro
       - /var/run/docker.sock:/var/run/docker.sock:ro
     networks:
       - observability
     deploy:
       resources:
         limits:
           cpus: "0.3"
           memory: 128M 
      



volumes:
  postgres_data:
  pgadmin_data:
  caddy_data:
  caddy_config:
  prometheus-data:
  loki-data:
  grafana-data:

networks:
  frontend: { driver: bridge }
  backend: { driver: bridge, internal: true }
  observability: { driver: bridge } 