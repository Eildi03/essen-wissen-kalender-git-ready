services:
  postgres:
    ports: ["127.0.0.1:5433:5432"]  # Deaktiviert - PostgreSQL nur intern
  pgadmin:
    image: dpage/pgadmin4:8.14
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@example.org}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:?PGADMIN_PASSWORD muss gesetzt werden}
      PGADMIN_CONFIG_SERVER_MODE: "True"
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "True"
    # ports: ["127.0.0.1:8081:80"]
    networks: [backend]  
  mailpit:
    image: axllent/mailpit:v1.21
    restart: unless-stopped
    networks: [backend]
    ports: ["127.0.0.1:8025:8025", "127.0.0.1:1025:1025"]
