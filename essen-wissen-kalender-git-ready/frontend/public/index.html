<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#123b3d" />
  <title>Essen-Wissen | Einsatzkalender</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --ink: #17393a;
      --ink-soft: #426466;
      --teal: #123b3d;
      --teal-2: #1b5351;
      --cream: #faf7ee;
      --paper: #fffdf8;
      --line: #dfe7de;
      --line-strong: #cbd8cd;
      --sun: #f4b85f;
      --sun-soft: #fff0d4;
      --leaf: #70a57b;
      --leaf-soft: #e2f0e2;
      --coral: #e87867;
      --coral-soft: #fde3dd;
      --sky: #88b9bf;
      --sky-soft: #e3f1f2;
      --moss: #6c7b50;
      --shadow: 0 18px 44px rgba(18, 59, 61, .09);
      --radius: 18px;
    }

    * { box-sizing: border-box; }
    html { background: var(--cream); }
    body {
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(circle at 87% 4%, rgba(244,184,95,.15), transparent 22rem),
        var(--cream);
      font-family: "DM Sans", sans-serif;
      min-width: 320px;
    }
    button, input, select, textarea { font: inherit; }
    button { cursor: pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible, a:focus-visible {
      outline: 3px solid rgba(232,120,103,.55);
      outline-offset: 3px;
    }
    a { color: inherit; }
    .hidden { display: none !important; }
    .icon { width: 18px; height: 18px; display: inline-block; flex: 0 0 auto; }
    .icon svg { width: 100%; height: 100%; display: block; }

    .app-shell { min-height: 100vh; display: grid; grid-template-columns: 238px 1fr; }
    .sidebar {
      background: var(--teal);
      color: #eff5e9;
      padding: 27px 18px 18px;
      display: flex;
      flex-direction: column;
      position: sticky;
      top: 0;
      height: 100vh;
      overflow: auto;
    }
    .brand { display: flex; align-items: center; gap: 11px; padding: 0 10px; margin-bottom: 38px; }
    .brand-mark { width: 42px; height: 42px; background: var(--sun); color: var(--teal); border-radius: 13px 13px 13px 4px; display: grid; place-items: center; transform: rotate(-3deg); }
    .brand-mark .icon { width: 25px; height: 25px; }
    .brand-copy strong { display: block; font-size: 14px; letter-spacing: -.02em; }
    .brand-copy small { color: #b4d1c0; font-size: 10px; letter-spacing: .08em; text-transform: uppercase; }
    .nav-label { color: #7fa8a0; font: 10px "Space Mono", monospace; text-transform: uppercase; letter-spacing: .12em; padding: 0 12px; margin-bottom: 10px; }
    .nav { display: grid; gap: 5px; }
    .nav button { border: 0; background: transparent; color: #c8ded1; width: 100%; display: flex; align-items: center; gap: 11px; padding: 11px 12px; border-radius: 11px; text-align: left; font-size: 13px; transition: .18s ease; }
    .nav button:hover { background: rgba(255,255,255,.08); color: white; }
    .nav button.active { background: #e7f0df; color: var(--teal); font-weight: 700; }
    .nav button.active .nav-dot { background: var(--coral); }
    .nav-dot { width: 7px; height: 7px; border-radius: 50%; background: #75a59b; margin-left: 2px; }
    .sidebar-spacer { flex: 1; }
    .privacy-card { margin: 24px 5px 16px; padding: 15px; border: 1px solid rgba(207,231,209,.2); background: rgba(255,255,255,.06); border-radius: 14px; }
    .privacy-card .icon { color: var(--sun); }
    .privacy-card strong { display: block; font-size: 12px; margin: 9px 0 5px; }
    .privacy-card p { color: #a8c7b9; font-size: 11px; line-height: 1.45; margin: 0; }
    .demo-badge { border: 1px solid rgba(244,184,95,.5); color: #f7ce85; border-radius: 100px; padding: 8px 10px; font: 10px "Space Mono", monospace; letter-spacing: .04em; text-align: center; }

    .content { padding: 0 36px 46px; min-width: 0; }
    .topbar { height: 76px; display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .breadcrumbs { color: #6a8180; font-size: 12px; display: flex; gap: 8px; align-items: center; }
    .breadcrumbs b { color: var(--ink); font-weight: 700; }
    .top-actions { display: flex; gap: 9px; align-items: center; }
    .mode-switch { background: #edf1e9; border: 1px solid var(--line-strong); padding: 3px; border-radius: 100px; display: flex; gap: 2px; }
    .mode-switch button { border: 0; color: #6c7d7b; border-radius: 100px; padding: 7px 11px; font-size: 11px; background: transparent; }
    .mode-switch button.active { color: var(--teal); background: white; box-shadow: 0 2px 7px rgba(18,59,61,.11); font-weight: 700; }
    .avatar { width: 33px; height: 33px; border-radius: 50%; background: var(--coral); color: white; display: grid; place-items: center; font-size: 11px; font-weight: 700; }

    .hero { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin: 21px 0 27px; }
    .eyebrow { color: var(--coral); font: 11px "Space Mono", monospace; text-transform: uppercase; letter-spacing: .09em; margin: 0 0 10px; }
    h1, h2, h3, p { margin-top: 0; }
    h1 { font-family: Fraunces, Georgia, serif; font-size: clamp(33px, 4vw, 53px); line-height: .98; letter-spacing: -.055em; margin: 0; max-width: 680px; }
    .hero-copy { margin: 13px 0 0; color: var(--ink-soft); font-size: 14px; max-width: 620px; line-height: 1.5; }
    .primary-btn { display: inline-flex; align-items: center; gap: 8px; border: 0; padding: 12px 15px; border-radius: 11px; color: white; background: var(--coral); font-weight: 700; font-size: 12px; box-shadow: 0 8px 18px rgba(232,120,103,.2); transition: transform .16s, box-shadow .16s; white-space: nowrap; }
    .primary-btn:hover { transform: translateY(-2px); box-shadow: 0 12px 22px rgba(232,120,103,.26); }
    .secondary-btn, .ghost-btn { display: inline-flex; align-items: center; justify-content: center; gap: 7px; background: white; border: 1px solid var(--line-strong); color: var(--ink); border-radius: 10px; padding: 10px 12px; font-size: 12px; font-weight: 700; }
    .ghost-btn { background: transparent; border-color: transparent; color: var(--ink-soft); }
    .ghost-btn:hover, .secondary-btn:hover { border-color: var(--teal-2); color: var(--teal); }

    .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
    .stat-card { background: var(--paper); border: 1px solid var(--line); border-radius: 15px; padding: 15px 16px 14px; position: relative; overflow: hidden; }
    .stat-card::after { content: ""; position: absolute; width: 76px; height: 76px; border-radius: 50%; right: -36px; bottom: -38px; background: var(--sun-soft); }
    .stat-card:nth-child(2)::after { background: var(--leaf-soft); }
    .stat-card:nth-child(3)::after { background: var(--sky-soft); }
    .stat-card:nth-child(4)::after { background: var(--coral-soft); }
    .stat-label { color: #728383; font-size: 11px; display: block; margin-bottom: 8px; }
    .stat-value { font: 700 26px "Space Mono", monospace; letter-spacing: -.08em; position: relative; z-index: 1; }
    .stat-note { color: #78908b; font-size: 10px; margin-left: 6px; position: relative; z-index: 1; }

    .toolbar { background: rgba(255,255,255,.55); border: 1px solid var(--line); border-radius: 14px; padding: 10px; display: flex; align-items: center; gap: 9px; margin-bottom: 18px; flex-wrap: wrap; }
    .search-wrap { flex: 1 1 190px; position: relative; min-width: 180px; }
    .search-wrap .icon { position: absolute; left: 11px; top: 10px; color: #78908b; width: 15px; height: 15px; }
    .search { width: 100%; height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 11px 0 34px; background: white; font-size: 12px; color: var(--ink); }
    .filter-select { height: 36px; border: 1px solid var(--line); border-radius: 9px; padding: 0 28px 0 10px; background: white; color: var(--ink); font-size: 11px; max-width: 145px; }
    .toolbar-divider { width: 1px; height: 23px; background: var(--line-strong); margin: 0 2px; }
    .view-switch { display: flex; background: #eaf0e8; border-radius: 9px; padding: 3px; gap: 2px; }
    .view-switch button { border: 0; background: transparent; color: #6e8180; padding: 7px 9px; border-radius: 7px; font-size: 10px; }
    .view-switch button.active { background: white; color: var(--teal); font-weight: 700; box-shadow: 0 2px 6px rgba(18,59,61,.09); }

    .workspace { display: grid; grid-template-columns: minmax(0, 1fr) 252px; gap: 18px; align-items: start; }
    .calendar-card { background: var(--paper); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); min-width: 0; overflow: hidden; }
    .calendar-header { padding: 21px 22px 18px; display: flex; justify-content: space-between; align-items: center; gap: 14px; border-bottom: 1px solid var(--line); }
    .period-title { font: 700 25px Fraunces, Georgia, serif; letter-spacing: -.04em; }
    .period-subtitle { font-size: 11px; color: #81918b; margin-top: 4px; }
    .period-controls { display: flex; align-items: center; gap: 6px; }
    .icon-btn { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 9px; }
    .icon-btn:hover { background: var(--teal); color: white; border-color: var(--teal); }
    .today-btn { height: 32px; padding: 0 10px; border: 1px solid var(--line); background: white; color: var(--ink); border-radius: 9px; font-size: 11px; font-weight: 700; }
    .today-btn:hover { border-color: var(--teal); }
    .calendar-body { min-height: 500px; }

    .month-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); }
    .weekday { padding: 12px 10px 10px; color: #8b9a93; font: 10px "Space Mono", monospace; text-transform: uppercase; letter-spacing: .07em; border-bottom: 1px solid var(--line); }
    .month-day { min-height: 108px; padding: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(255,255,255,.44); }
    .month-day:nth-child(7n) { border-right: 0; }
    .month-day.is-muted { background: #fbfaf5; }
    .month-day.is-today { background: #fff5df; }
    .day-number { display: flex; align-items: center; justify-content: space-between; color: var(--ink-soft); font: 11px "Space Mono", monospace; margin-bottom: 7px; }
    .day-number .today-dot { width: 21px; height: 21px; border-radius: 50%; display: grid; place-items: center; background: var(--coral); color: white; font-weight: 700; }
    .day-events { display: grid; gap: 5px; }
    .event-chip { text-align: left; width: 100%; border: 0; border-left: 3px solid var(--leaf); background: var(--leaf-soft); padding: 6px 6px 6px 7px; border-radius: 4px 7px 7px 4px; color: var(--ink); min-width: 0; transition: .15s ease; }
    .event-chip:hover { transform: translateX(2px); filter: brightness(.98); }
    .event-chip.bus { border-left-color: var(--sun); background: var(--sun-soft); }
    .event-chip.kitchen { border-left-color: var(--leaf); background: var(--leaf-soft); }
    .event-chip.cancelled { opacity: .66; text-decoration: line-through; }
    .event-chip .chip-time { font: 9px "Space Mono", monospace; color: #657975; display: block; margin-bottom: 3px; }
    .event-chip .chip-title { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 10px; font-weight: 700; }
    .event-chip .chip-place { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 9px; color: #71837d; margin-top: 2px; }
    .more-events { color: var(--coral); border: 0; background: none; padding: 0 4px; font-size: 10px; font-weight: 700; }

    .week-grid { display: grid; grid-template-columns: 47px repeat(7, minmax(0, 1fr)); }
    .week-time-col { border-right: 1px solid var(--line); }
    .week-time-head { height: 48px; border-bottom: 1px solid var(--line); }
    .week-time { height: 69px; padding: 8px 6px 0 0; text-align: right; color: #91a099; font: 9px "Space Mono", monospace; border-bottom: 1px dashed #e7ece3; }
    .week-day-head { height: 48px; text-align: center; padding-top: 8px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); }
    .week-day-head strong { font: 700 12px "Space Mono", monospace; display: block; }
    .week-day-head span { color: #899892; font-size: 9px; text-transform: uppercase; }
    .week-day-head.is-today strong { color: white; background: var(--coral); border-radius: 50%; width: 23px; height: 23px; display: grid; place-items: center; margin: -2px auto 1px; }
    .week-column { min-width: 0; position: relative; border-right: 1px solid var(--line); background: repeating-linear-gradient(to bottom, transparent 0, transparent 68px, #e7ece3 69px); }
    .week-column:last-child, .week-day-head:last-child { border-right: 0; }
    .week-spacer { height: 690px; }
    .week-event { position: absolute; left: 4px; right: 4px; min-height: 58px; border-radius: 8px; padding: 7px; text-align: left; border: 0; border-left: 3px solid var(--leaf); background: var(--leaf-soft); color: var(--ink); overflow: hidden; }
    .week-event.bus { border-left-color: var(--sun); background: var(--sun-soft); }
    .week-event.cancelled { opacity: .63; }
    .week-event time { display: block; font: 9px "Space Mono", monospace; color: #687a74; margin-bottom: 3px; }
    .week-event strong { font-size: 10px; display: block; line-height: 1.2; }
    .week-event small { color: #6f817c; font-size: 9px; display: block; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .list-view { padding: 0 22px 22px; }
    .list-month { padding-top: 20px; }
    .list-month-title { font: 700 15px Fraunces, Georgia, serif; padding-bottom: 9px; border-bottom: 1px solid var(--line); }
    .list-row { display: grid; grid-template-columns: 65px minmax(0, 1fr) auto; gap: 15px; align-items: center; padding: 15px 0; border-bottom: 1px solid var(--line); }
    .list-date { color: var(--coral); font: 700 13px "Space Mono", monospace; }
    .list-date small { display: block; color: #879891; font: 10px "DM Sans", sans-serif; margin-top: 4px; }
    .list-main { min-width: 0; }
    .list-title { font-weight: 700; font-size: 13px; margin-bottom: 4px; }
    .list-meta { color: #71837c; font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .list-actions { display: flex; align-items: center; gap: 8px; }
    .type-pill, .status-pill, .visibility-pill { display: inline-flex; align-items: center; gap: 5px; padding: 5px 7px; border-radius: 100px; font-size: 9px; font-weight: 700; white-space: nowrap; }
    .type-pill.bus { color: #8a5b16; background: var(--sun-soft); }
    .type-pill.kitchen { color: #396b48; background: var(--leaf-soft); }
    .status-pill.confirmed { color: #34724b; background: var(--leaf-soft); }
    .status-pill.planned { color: #8b641b; background: var(--sun-soft); }
    .status-pill.request { color: #477b86; background: var(--sky-soft); }
    .status-pill.done { color: #58645e; background: #e9eee8; }
    .status-pill.cancelled { color: #a34e42; background: var(--coral-soft); }
    .visibility-pill { color: #607772; background: #eef2ed; }
    .year-view { padding: 19px 20px 24px; }
    .year-summary { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin-bottom: 15px; padding: 13px 14px; background: #f4f7ef; border-radius: 12px; }
    .year-summary p { margin: 0; color: #6d817a; font-size: 11px; }
    .year-summary strong { font: 700 17px "Space Mono", monospace; }
    .year-mini-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 13px; }
    .mini-month { border: 1px solid var(--line); border-radius: 11px; padding: 10px; background: white; }
    .mini-month h4 { margin: 0 0 9px; font: 700 13px Fraunces, Georgia, serif; }
    .mini-weekdays, .mini-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; text-align: center; }
    .mini-weekdays { color: #9aa69d; font-size: 8px; margin-bottom: 4px; }
    .mini-day { height: 20px; font: 9px "Space Mono", monospace; border-radius: 4px; display: grid; place-items: center; cursor: pointer; color: #6d817a; }
    .mini-day:hover { background: #edf2ea; }
    .mini-day.has-bus { background: var(--sun-soft); color: #79531d; font-weight: 700; }
    .mini-day.has-kitchen { background: var(--leaf-soft); color: #356b47; font-weight: 700; }
    .mini-day.has-both { background: linear-gradient(135deg, var(--sun-soft) 50%, var(--leaf-soft) 50%); color: var(--ink); font-weight: 700; }
    .mini-day.is-today { outline: 2px solid var(--coral); outline-offset: -2px; }

    .insight-rail { display: grid; gap: 13px; }
    .rail-card { background: var(--paper); border: 1px solid var(--line); border-radius: 15px; padding: 16px; }
    .rail-kicker { color: var(--coral); font: 9px "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; margin-bottom: 9px; }
    .rail-card h3 { font: 700 20px Fraunces, Georgia, serif; letter-spacing: -.035em; margin-bottom: 7px; }
    .rail-card p { color: #6f817b; font-size: 11px; line-height: 1.45; margin-bottom: 12px; }
    .next-date { font: 700 12px "Space Mono", monospace; color: var(--coral); }
    .next-title { font-size: 13px; font-weight: 700; margin-top: 6px; }
    .next-meta { color: #778983; font-size: 10px; margin-top: 4px; }
    .rail-link { color: var(--teal-2); border: 0; background: none; font-size: 11px; font-weight: 700; padding: 0; }
    .resource-row { margin-top: 13px; }
    .resource-head { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; margin-bottom: 6px; }
    .resource-head span:last-child { color: #7c9087; font: 10px "Space Mono", monospace; }
    .meter { height: 7px; border-radius: 100px; background: #edf0e9; overflow: hidden; }
    .meter span { display: block; height: 100%; border-radius: inherit; }
    .meter.bus span { background: var(--sun); }
    .meter.kitchen span { background: var(--leaf); }
    .legend { display: grid; gap: 8px; }
    .legend-item { display: flex; gap: 8px; align-items: center; color: #6e817a; font-size: 10px; }
    .legend-mark { width: 10px; height: 10px; border-radius: 3px; }
    .legend-mark.bus { background: var(--sun); }
    .legend-mark.kitchen { background: var(--leaf); }
    .legend-mark.today { background: var(--coral); border-radius: 50%; }
    .small-note { margin-top: 14px; color: #91a099; font-size: 10px; line-height: 1.45; }
    .small-note .icon { width: 12px; height: 12px; vertical-align: -3px; color: var(--teal-2); }
    .empty-state { padding: 58px 20px; text-align: center; color: #81928b; }
    .empty-state .icon { width: 32px; height: 32px; color: var(--coral); margin-bottom: 10px; }
    .empty-state strong { display: block; color: var(--ink); font-size: 14px; margin-bottom: 5px; }
    .empty-state p { font-size: 11px; }

    .modal-backdrop { position: fixed; inset: 0; z-index: 20; background: rgba(12, 37, 38, .42); display: grid; place-items: center; padding: 20px; }
    .modal { background: var(--paper); max-width: 760px; width: 100%; max-height: min(760px, 92vh); overflow: auto; border-radius: 18px; box-shadow: 0 30px 80px rgba(8,30,31,.25); }
    .modal-head { padding: 19px 22px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--paper); z-index: 1; }
    .modal-head h2 { font: 700 23px Fraunces, Georgia, serif; letter-spacing: -.04em; margin: 0; }
    .modal-body { padding: 20px 22px 24px; }
    .form-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
    .form-grid .full { grid-column: 1 / -1; }
    .field { display: grid; gap: 6px; }
    .field label { font-size: 11px; color: #607670; font-weight: 700; }
    .field label .req { color: var(--coral); }
    .field input, .field select, .field textarea { width: 100%; border: 1px solid var(--line-strong); background: white; border-radius: 9px; padding: 9px 10px; color: var(--ink); font-size: 12px; }
    .field textarea { min-height: 75px; resize: vertical; }
    .field-help { color: #8a9992; font-size: 10px; line-height: 1.35; font-weight: 400; }
    .form-section-label { grid-column: 1 / -1; padding-top: 7px; border-top: 1px solid var(--line); color: var(--teal-2); font: 700 10px "Space Mono", monospace; letter-spacing: .08em; text-transform: uppercase; }
    .conflict-alert { grid-column: 1 / -1; background: var(--coral-soft); border: 1px solid #f2b9ae; padding: 11px 12px; border-radius: 10px; color: #8d4339; font-size: 11px; display: flex; gap: 8px; align-items: flex-start; }
    .conflict-alert strong { display: block; margin-bottom: 2px; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; padding-top: 18px; margin-top: 18px; border-top: 1px solid var(--line); }

    .drawer-backdrop { position: fixed; inset: 0; z-index: 15; background: rgba(12,37,38,.22); }
    .drawer { position: fixed; z-index: 16; right: 0; top: 0; height: 100vh; width: min(490px, 100%); background: var(--paper); box-shadow: -24px 0 60px rgba(12,37,38,.16); overflow: auto; }
    .drawer-head { padding: 23px 24px 18px; border-bottom: 1px solid var(--line); background: linear-gradient(135deg, #fffdf8 70%, #f4ecd9); }
    .drawer-top { display: flex; justify-content: space-between; gap: 12px; }
    .drawer-head h2 { font: 700 30px Fraunces, Georgia, serif; letter-spacing: -.055em; line-height: 1.02; margin: 14px 0 10px; }
    .drawer-sub { color: #70837b; font-size: 12px; line-height: 1.45; margin: 0; }
    .drawer-body { padding: 20px 24px 34px; }
    .detail-block { padding: 15px 0; border-bottom: 1px solid var(--line); }
    .detail-block:first-child { padding-top: 0; }

              <header class="topbar"><div class="breadcrumbs"><span>Arbeitsbereich</span><b>›</b><b>Einsatzkalender</b></div><div class="top-actions"><div class="mode-switch" role="group" aria-label="Ansicht wählen"><button data-mode="internal" class="active">Intern</button><button data-mode="public">Öffentlich</button></div><div class="avatar" title="Diether Eildermann">DE</div></div></header>
              <section class="hero"><div><p class="eyebrow">Planen, kochen, Wirkung sehen</p><h1>Der Kalender, der<br><em>Bewegung</em> schafft.</h1><p class="hero-copy">Alle Bus-Einsätze und Küchenmomente an einem Ort. Klar genug für die Planung, offen genug für die Gemeinschaft.</p></div><button class="primary-btn" id="new-event">${icon('plus')} Neuen Termin anlegen</button></section>
              <section class="stats" id="stats"></section>
              <section class="toolbar" aria-label="Kalenderwerkzeuge">
                <div class="search-wrap">${icon('search')}<input id="search" class="search" placeholder="Einrichtung, Ort, Thema …" aria-label="Veranstaltungen durchsuchen" /></div>
                <select id="type-filter" class="filter-select" aria-label="Veranstaltungsart"><option value="all">Alle Arten</option><option value="bus">Bus-Einsatz</option><option value="kitchen">Stiftungsküche</option></select>
                <select id="status-filter" class="filter-select" aria-label="Status"><option value="all">Alle Status</option><option>bestätigt</option><option>vorläufig geplant</option><option>Anfrage</option><option>durchgeführt</option><option>abgesagt</option></select>
                <select id="region-filter" class="filter-select" aria-label="Bundesland"><option value="all">Alle Bundesländer</option><option>Berlin</option><option>Brandenburg</option><option>Sachsen</option><option>Sachsen-Anhalt</option></select>
                <span class="toolbar-divider"></span>
                <div class="view-switch" role="group" aria-label="Kalenderansicht"><button data-view="week">Woche</button><button data-view="month" class="active">Monat</button><button data-view="year">Jahr</button><button data-view="list">Liste</button></div>
                <button class="secondary-btn" id="print-btn">${icon('print')} Drucken</button>
              </section>
              <div class="workspace"><section class="calendar-card"><div id="calendar-header" class="calendar-header"></div><div id="calendar-body" class="calendar-body"></div></section><aside class="insight-rail" id="insight-rail"></aside></div>
            </main>
          </div>
          <div id="drawer-host"></div><div id="modal-host"></div><div id="toast-host"></div>`;
        bindShellEvents();
        renderAll();
      }

      function bindShellEvents() {
        document.getElementById('new-event').addEventListener('click', () => openForm());
        document.getElementById('print-btn').addEventListener('click', () => window.print());
        document.getElementById('search').addEventListener('input', e => { state.search = e.target.value; renderAll(); });
        document.getElementById('type-filter').addEventListener('change', e => { state.type = e.target.value; renderAll(); });
        document.getElementById('status-filter').addEventListener('change', e => { state.status = e.target.value; renderAll(); });
        document.getElementById('region-filter').addEventListener('change', e => { state.region = e.target.value; renderAll(); });
        document.querySelectorAll('[data-view]').forEach(btn => btn.addEventListener('click', () => { state.view = btn.dataset.view; renderAll(); }));
        document.querySelectorAll('[data-mode]').forEach(btn => btn.addEventListener('click', () => { state.mode = btn.dataset.mode; renderAll(); showToast(state.mode === 'public' ? 'Öffentliche, datensparsame Ansicht aktiv.' : 'Interne Ansicht aktiv.'); }));
        document.querySelectorAll('[data-nav]').forEach(btn => btn.addEventListener('click', () => showToast(btn.dataset.nav === 'calendar' ? 'Du bist bereits im Einsatzkalender.' : 'Dieser Bereich ist für die nächste Ausbaustufe vorbereitet.')));
      }

      function renderAll() {
        document.querySelectorAll('[data-view]').forEach(btn => btn.classList.toggle('active', btn.dataset.view === state.view));
        document.querySelectorAll('[data-mode]').forEach(btn => btn.classList.toggle('active', btn.dataset.mode === state.mode));
        const search = document.getElementById('search'); if (search && search.value !== state.search) search.value = state.search;
        const type = document.getElementById('type-filter'); if (type) type.value = state.type;
        const status = document.getElementById('status-filter'); if (status) status.value = state.status;
        const region = document.getElementById('region-filter'); if (region) region.value = state.region;
        renderStats(); renderCalendar(); renderRail();
        if (state.selectedId) renderDrawer();
      }

      function renderStats() {
        const events = visibleEvents();
        const institutions = new Set(events.map(e => e.institution)).size;
        const children = events.reduce((sum,e) => sum + Number(e.participants || 0), 0);
        const next = events.find(e => e.start >= keyDate(demoToday));
        document.getElementById('stats').innerHTML = `
          <div class="stat-card"><span class="stat-label">Termine im Filter</span><span class="stat-value">${events.length}</span><span class="stat-note">Demodaten</span></div>
          <div class="stat-card"><span class="stat-label">Bus-Einsätze</span><span class="stat-value">${events.filter(e=>e.type==='bus').length}</span><span class="stat-note">unterwegs</span></div>
          <div class="stat-card"><span class="stat-label">Einrichtungen</span><span class="stat-value">${institutions}</span><span class="stat-note">erreicht</span></div>
          <div class="stat-card"><span class="stat-label">Teilnehmende</span><span class="stat-value">${children}</span><span class="stat-note">geplant / erreicht</span></div>`;
      }

      function renderCalendar() {
        const title = state.view === 'year' ? String(state.anchor.getFullYear()) : state.view === 'week' ? weekTitle() : state.view === 'list' ? 'Kommende Veranstaltungen' : monthTitle(state.anchor);
        const subtitle = state.view === 'list' ? visibleEvents().length + ' sichtbare Termine · sortiert nach Start' : state.mode === 'public' ? 'Öffentliche Ansicht · nur freigegebene Angaben' : 'Interne Planung · vollständige Termininformationen';
        document.getElementById('calendar-header').innerHTML = `<div><div class="period-title">${title}</div><div class="period-subtitle">${subtitle}</div></div><div class="period-controls"><button class="today-btn" id="today-btn">Heute</button><button class="icon-btn" id="prev-btn" aria-label="Vorheriger Zeitraum">${icon('left')}</button><button class="icon-btn" id="next-btn" aria-label="Nächster Zeitraum">${icon('right')}</button></div>`;
        document.getElementById('today-btn').addEventListener('click', () => { state.anchor = new Date(demoToday); renderAll(); });
        document.getElementById('prev-btn').addEventListener('click', () => shiftPeriod(-1));
        document.getElementById('next-btn').addEventListener('click', () => shiftPeriod(1));
        const body = document.getElementById('calendar-body');
        if (state.view === 'month') body.innerHTML = renderMonth();
        if (state.view === 'week') body.innerHTML = renderWeek();
        if (state.view === 'year') body.innerHTML = renderYear();
        if (state.view === 'list') body.innerHTML = renderList();
        bindViewEvents();
      }

      function shiftPeriod(amount) {
        const d = new Date(state.anchor);
        if (state.view === 'week') d.setDate(d.getDate() + amount * 7);
        else if (state.view === 'year') d.setFullYear(d.getFullYear() + amount);
        else d.setMonth(d.getMonth() + amount);
        state.anchor = d; renderAll();
      }
      function weekTitle() {
        const start = startOfWeek(state.anchor), end = addDays(start, 6);
        if (start.getMonth() === end.getMonth()) return `${start.getDate()}.–${end.getDate()}. ${months[start.getMonth()]} ${start.getFullYear()}`;
        return `${start.getDate()}. ${monthShort[start.getMonth()]} – ${end.getDate()}. ${monthShort[end.getMonth()]} ${end.getFullYear()}`;
      }
      function eventChip(event) {
        const cancelled = event.status === 'abgesagt' ? ' cancelled' : '';
        return `<button class="event-chip ${event.type}${cancelled}" data-event-id="${event.id}" aria-label="${esc(publicTitle(event))}">${event.type === 'bus' ? icon('bus') : icon('chef')}<span class="chip-time">${esc(event.startTime)}–${esc(event.endTime)}</span><span class="chip-title">${esc(publicTitle(event))}</span><span class="chip-place">${esc(placeLabel(event))}</span></button>`;
      }
      function renderMonth() {
        const y = state.anchor.getFullYear(), m = state.anchor.getMonth();
        const first = new Date(y,m,1), days = new Date(y,m+1,0).getDate(), offset = mondayIndex(first);
        let html = '<div class="month-grid">' + weekdays.map(d => `<div class="weekday">${d}</div>`).join('');
        const total = Math.ceil((offset + days) / 7) * 7;
        for (let i=0; i<total; i++) {
          const day = i - offset + 1, date = new Date(y,m,day), inMonth = day >= 1 && day <= days;
          const key = keyDate(date), evs = inMonth ? eventsForDate(date) : [];
          html += `<div class="month-day ${inMonth ? '' : 'is-muted'} ${sameDay(date,demoToday) ? 'is-today' : ''}"><div class="day-number">${inMonth ? (sameDay(date,demoToday) ? `<span class="today-dot">${day}</span>` : `<span>${day}</span>`) : `<span>${date.getDate()}</span>`}</div><div class="day-events">${evs.slice(0,3).map(eventChip).join('')}${evs.length > 3 ? `<button class="more-events" data-day="${key}">+${evs.length-3} weitere</button>` : ''}</div></div>`;
        }
        return html + '</div>';
      }
      function renderWeek() {
        const start = startOfWeek(state.anchor), hours = ['08:00','09:00','10:00','11:00','12:00','13:00','14:00','15:00','16:00','17:00'];
        let html = '<div class="week-grid-wrap"><div class="week-grid"><div class="week-time-col"><div class="week-time-head"></div>'+hours.map(h=>`<div class="week-time">${h}</div>`).join('')+'</div>';
        for (let i=0;i<7;i++) { const d = addDays(start,i); html += `<div class="week-day-head ${sameDay(d,demoToday) ? 'is-today' : ''}"><span>${weekdays[i]}</span><strong>${d.getDate()}</strong></div>`; }
        html += '<div class="week-time-col"><div class="week-spacer"></div></div>';
        for (let i=0;i<7;i++) {
          const d = addDays(start,i), key = keyDate(d), evs = eventsForDate(d);
          html += `<div class="week-column"><div class="week-spacer"></div>${evs.map(e => { const top = Math.max(0, (Number(e.startTime.slice(0,2))-8)*69 + (Number(e.startTime.slice(3))-0)/60*69); const height = Math.max(58, ((Number(e.endTime.slice(0,2))-Number(e.startTime.slice(0,2))) + (Number(e.endTime.slice(3))-Number(e.startTime.slice(3)))/60) * 69); return `<button class="week-event ${e.type} ${e.status==='abgesagt'?'cancelled':''}" data-event-id="${e.id}" style="top:${top+48}px;height:${height}px"><time>${esc(e.startTime)}–${esc(e.endTime)}</time><strong>${esc(publicTitle(e))}</strong><small>${esc(state.mode==='public'?e.city:e.institution)}</small></button>`; }).join('')}</div>`;
        }
        return html + '</div></div>';
      }
      function renderYear() {
        const y = state.anchor.getFullYear(), events = visibleEvents(), byMonth = Array.from({length:12}, () => 0);
        events.forEach(e => { const d=parseDate(e.start); if (d.getFullYear()===y) byMonth[d.getMonth()]++; });
        let html = `<div class="year-view"><div class="year-summary"><p><strong>${events.filter(e=>parseDate(e.start).getFullYear()===y).length}</strong> Termine in ${y} · farbige Tage zeigen Ressourcen</p><span class="visibility-pill">${state.mode === 'public' ? 'Öffentlich' : 'Intern'}</span></div><div class="year-mini-grid">`;
        for (let m=0;m<12;m++) {
          const first = new Date(y,m,1), days = new Date(y,m+1,0).getDate(), off=mondayIndex(first), monthEvents=events.filter(e=>parseDate(e.start).getFullYear()===y && parseDate(e.start).getMonth()===m);
          let daysHtml=''; for(let i=0;i<off;i++) daysHtml+='<span></span>';
          for(let d=1;d<=days;d++){ const date=new Date(y,m,d), evs=monthEvents.filter(e=>e.start<=keyDate(date)&&e.end>=keyDate(date)); const kinds=new Set(evs.map(e=>e.type)); daysHtml += `<button class="mini-day ${kinds.size>1?'has-both':kinds.has('bus')?'has-bus':kinds.has('kitchen')?'has-kitchen':''} ${sameDay(date,demoToday)?'is-today':''}" data-mini-date="${keyDate(date)}">${d}</button>`; }
          html += `<div class="mini-month"><h4>${months[m]} <span style="color:#93a19a;font:9px 'Space Mono',monospace">${byMonth[m] ? '· '+byMonth[m] : ''}</span></h4><div class="mini-weekdays">${weekdays.map(d=>`<span>${d[0]}</span>`).join('')}</div><div class="mini-days">${daysHtml}</div></div>`;
        }
        return html+'</div></div>';
      }
      function renderList() {
        const events = visibleEvents();
        if (!events.length) return `<div class="empty-state">${icon('search')}<strong>Keine Termine gefunden</strong><p>Versuche einen anderen Suchbegriff oder setze die Filter zurück.</p></div>`;
        const grouped = {};
        events.forEach(e => { const key=e.start.slice(0,7); (grouped[key] ||= []).push(e); });
        let html='<div class="list-view">';
        Object.keys(grouped).sort().forEach(key => { const [y,m]=key.split('-').map(Number); html += `<section class="list-month"><h3 class="list-month-title">${months[m-1]} ${y}</h3>`; grouped[key].forEach(e=>{ html += `<div class="list-row"><div class="list-date">${formatDate(e.start,{year:false})}<small>${parseDate(e.start).toLocaleDateString('de-DE',{weekday:'short'})}</small></div><div class="list-main"><div class="list-title">${typeIcon(e)} ${esc(publicTitle(e))}</div><div class="list-meta">${esc(e.startTime)}–${esc(e.endTime)} · ${esc(placeLabel(e))}</div></div><div class="list-actions"><span class="type-pill ${e.type}">${e.type==='bus'?'Bus':'Küche'}</span><span class="status-pill ${statusClass(e.status)}">${esc(e.status)}</span><button class="icon-btn" data-event-id="${e.id}" aria-label="Termin öffnen">${icon('right')}</button></div></div>`; }); html+='</section>'; });
        return html+'</div>';
      }
      function bindViewEvents() {
        document.querySelectorAll('[data-event-id]').forEach(el => el.addEventListener('click', () => { state.selectedId = el.dataset.eventId; renderDrawer(); }));
        document.querySelectorAll('[data-mini-date]').forEach(el => el.addEventListener('click', () => { state.anchor = parseDate(el.dataset.miniDate); state.view='month'; renderAll(); }));
        document.querySelectorAll('[data-day]').forEach(el => el.addEventListener('click', () => { state.anchor=parseDate(el.dataset.day); state.view='day'; state.view='month'; renderAll(); }));
      }

      function renderRail() {
        const events = visibleEvents(), next = events.find(e => e.start >= keyDate(demoToday) && e.status !== 'abgesagt') || events.find(e=>e.status!=='abgesagt');
        const busCount = events.filter(e=>e.type==='bus' && e.status!=='abgesagt').length, kitchenCount = events.filter(e=>e.type==='kitchen' && e.status!=='abgesagt').length, total=Math.max(1,busCount+kitchenCount);
        document.getElementById('insight-rail').innerHTML = `
          <section class="rail-card"><div class="rail-kicker">Als Nächstes</div>${next ? `<div class="next-date">${formatLong(next.start)} · ${next.startTime} Uhr</div><div class="next-title">${esc(publicTitle(next))}</div><div class="next-meta">${esc(placeLabel(next))}</div><button class="rail-link" style="margin-top:14px" data-event-id="${next.id}">Termin öffnen ${icon('right')}</button>` : '<h3>Alles ruhig.</h3><p>Für die aktuelle Auswahl stehen keine weiteren Termine an.</p>'}</section>
          <section class="rail-card"><div class="rail-kicker">Ressourcenblick</div><h3>${events.length} Einträge</h3><p>Belegung im aktuellen Filter – abgesagte Termine nicht eingerechnet.</p><div class="resource-row"><div class="resource-head"><span>${icon('bus')} Essen-Wissen Bus</span><span>${busCount}/${total}</span></div><div class="meter bus"><span style="width:${Math.round(busCount/total*100)}%"></span></div></div><div class="resource-row"><div class="resource-head"><span>${icon('chef')} Stiftungsküche</span><span>${kitchenCount}/${total}</span></div><div class="meter kitchen"><span style="width:${Math.round(kitchenCount/total*100)}%"></span></div></div></section>
          <section class="rail-card"><div class="rail-kicker">Orientierung</div><div class="legend"><div class="legend-item"><i class="legend-mark bus"></i> Bus-Einsatz</div><div class="legend-item"><i class="legend-mark kitchen"></i> Stiftungsküche</div><div class="legend-item"><i class="legend-mark today"></i> Heute · 31.08.2026</div></div><div class="small-note">${icon('shield')} Demo-Daten mit frei erfundenen Kontakten. Die öffentliche Ansicht blendet interne Einträge und persönliche Kontaktdaten aus.</div></section>`;
        document.querySelectorAll('#insight-rail [data-event-id]').forEach(el => el.addEventListener('click', () => { state.selectedId=el.dataset.eventId; renderDrawer(); }));
      }

      function renderDrawer() {
        const event = state.events.find(e=>e.id===state.selectedId);
        if (!event) { document.getElementById('drawer-host').innerHTML=''; return; }
        const publicMode = state.mode === 'public';
        const detail = publicMode ? `
          <div class="detail-block"><div class="detail-label">Öffentlich sichtbar</div><div class="detail-value">${esc(event.publicDescription || event.publicTitle)}</div></div>
          <div class="detail-block"><div class="detail-grid"><div class="detail-cell"><span>Datum</span><strong>${formatLong(event.start)}</strong></div><div class="detail-cell"><span>Uhrzeit</span><strong>${esc(event.startTime)}–${esc(event.endTime)} Uhr</strong></div><div class="detail-cell"><span>Veranstaltungsart</span><strong>${typeLabel(event)}</strong></div><div class="detail-cell"><span>Ort</span><strong>${esc(event.city)}, ${esc(event.state)}</strong></div></div></div>
          <div class="privacy-callout">${icon('shield')} Diese öffentliche Detailansicht enthält keine persönlichen Kontaktdaten, internen Notizen oder vollständige Adresse.</div>` : `
          <div class="detail-block"><div class="detail-label">Planung</div><div class="detail-grid"><div class="detail-cell"><span>Datum</span><strong>${formatLong(event.start)}</strong></div><div class="detail-cell"><span>Uhrzeit</span><strong>${esc(event.startTime)}–${esc(event.endTime)} Uhr</strong></div><div class="detail-cell"><span>Art</span><strong>${typeIcon(event)} ${typeLabel(event)}</strong></div><div class="detail-cell"><span>Ressource</span><strong>${esc(event.resource)}</strong></div><div class="detail-cell"><span>Teilnehmende</span><strong>${esc(event.participants)} · ${esc(event.audience)}</strong></div><div class="detail-cell"><span>Thema / Modul</span><strong>${esc(event.topic)}</strong></div></div></div>
          <div class="detail-block"><div class="detail-label">Einrichtung & Ort</div><div class="detail-value"><strong>${esc(event.institution)}</strong><br>${esc(event.institutionType)}<br><br>${esc(event.street)} ${esc(event.house)}<br>${esc(event.postal)} ${esc(event.city)}<br>${esc(event.state)}${event.building ? '<br><span style="color:#70837b;font-size:11px">'+esc(event.building)+'</span>' : ''}</div><button class="secondary-btn" id="route-btn" style="margin-top:12px">${icon('route')} Route öffnen</button></div>
          <div class="detail-block"><div class="detail-label">Beschreibung</div><div class="detail-value">${esc(event.description)}</div></div>
          <div class="detail-block"><div class="detail-label">Ansprechpartner</div><div class="detail-value"><strong>${esc(event.contact.first)} ${esc(event.contact.last)}</strong><br>${esc(event.contact.role)} · ${esc(event.contact.company)}</div><div class="detail-grid" style="margin-top:12px"><div class="detail-cell"><span>Telefon</span><a href="tel:${esc(event.contact.phone)}">${icon('phone')} ${esc(event.contact.phone)}</a></div><div class="detail-cell"><span>Mobil</span><a href="tel:${esc(event.contact.mobile)}">${icon('phone')} ${esc(event.contact.mobile)}</a></div><div class="detail-cell"><span>E-Mail</span><a href="mailto:${esc(event.contact.email)}">${icon('mail')} ${esc(event.contact.email)}</a></div><div class="detail-cell"><span>Zuletzt geändert</span><strong>${esc(event.changed)}</strong></div></div></div>
          <div class="detail-block"><div class="detail-label">Interne Notiz</div><div class="detail-value">${esc(event.internalNotes)}</div><div class="small-note">${icon('shield')} Nur in der internen Ansicht sichtbar.</div></div>`;
        document.getElementById('drawer-host').innerHTML = `<div class="drawer-backdrop" id="drawer-backdrop"></div><aside class="drawer" role="dialog" aria-modal="true" aria-label="Termindetails"><div class="drawer-head"><div class="drawer-top"><span class="type-pill ${event.type}">${typeIcon(event)} ${typeLabel(event)}</span><button class="icon-btn" id="close-drawer" aria-label="Details schließen">${icon('close')}</button></div><h2>${esc(publicTitle(event))}</h2><p class="drawer-sub">${esc(placeLabel(event))}</p><div style="margin-top:12px"><span class="status-pill ${statusClass(event.status)}">${esc(event.status)}</span> <span class="visibility-pill">${publicMode ? 'Öffentlich' : esc(event.visibility)}</span></div></div><div class="drawer-body">${detail}<div class="drawer-actions">${!publicMode ? `<button class="secondary-btn" id="edit-event">${icon('edit')} Bearbeiten</button><button class="secondary-btn" id="copy-event">${icon('copy')} Kopieren</button><button class="secondary-btn" id="cancel-event">${icon(event.status==='abgesagt'?'check':'close')} ${event.status==='abgesagt'?'Wieder aktivieren':'Absagen'}</button><button class="secondary-btn" id="delete-event">${icon('trash')} Löschen</button>` : ''}<button class="secondary-btn" id="ics-event">${icon('download')} ICS exportieren</button></div></div></aside>`;
        document.getElementById('close-drawer').addEventListener('click', closeDrawer);
        document.getElementById('drawer-backdrop').addEventListener('click', closeDrawer);
        document.getElementById('ics-event').addEventListener('click', () => exportICS(event));
        if (!publicMode) {
          document.getElementById('edit-event').addEventListener('click', () => openForm(event.id));
          document.getElementById('copy-event').addEventListener('click', () => openForm(event.id, true));
          document.getElementById('cancel-event').addEventListener('click', () => { event.status = event.status === 'abgesagt' ? 'vorläufig geplant' : 'abgesagt'; event.changed='gerade eben'; renderAll(); renderDrawer(); showToast(event.status === 'abgesagt' ? 'Termin wurde abgesagt.' : 'Termin ist wieder vorläufig geplant.'); });
          document.getElementById('delete-event').addEventListener('click', () => { if(confirm('Diesen Demotermin wirklich löschen?')) { state.events=state.events.filter(e=>e.id!==event.id); closeDrawer(); renderAll(); showToast('Termin gelöscht.'); } });
          document.getElementById('route-btn').addEventListener('click', () => { const q=encodeURIComponent(`${event.street} ${event.house}, ${event.postal} ${event.city}, ${event.state}`); window.open('https://www.google.com/maps/search/?api=1&query='+q,'_blank'); });
        }
      }
      function closeDrawer() { state.selectedId=null; document.getElementById('drawer-host').innerHTML=''; }

      function openForm(eventId=null, copy=false) {
        state.modal='form'; state.editingId=copy ? null : eventId;
        const e = eventId ? state.events.find(x=>x.id===eventId) : null;
        document.getElementById('modal-host').innerHTML = `<div class="modal-backdrop" id="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-label="${e && !copy ? 'Termin bearbeiten' : 'Neuen Termin anlegen'}"><div class="modal-head"><h2>${e && !copy ? 'Termin bearbeiten' : 'Neuen Termin anlegen'}</h2><button class="icon-btn" id="close-modal" aria-label="Dialog schließen">${icon('close')}</button></div><form id="event-form" class="modal-body"><div class="form-grid"><div class="field full"><label for="f-title">Titel <span class="req">*</span></label><input id="f-title" name="title" required value="${esc(e && !copy ? e.title : e ? e.title+' · Kopie' : '')}" placeholder="z. B. Gemüsehelden unterwegs"></div><div class="field"><label for="f-type">Veranstaltungsart <span class="req">*</span></label><select id="f-type" name="type"><option value="bus" ${e?.type==='bus'?'selected':''}>Essen-Wissen Bus</option><option value="kitchen" ${e?.type==='kitchen'?'selected':''}>Stiftungsküche</option></select></div><div class="field"><label for="f-status">Status</label><select id="f-status" name="status">${['Anfrage','vorläufig geplant','bestätigt','durchgeführt','abgesagt'].map(s=>`<option ${e?.status===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="f-start">Datum <span class="req">*</span></label><input id="f-start" name="start" type="date" required value="${e?.start || keyDate(state.anchor)}"></div><div class="field"><label for="f-end">Enddatum</label><input id="f-end" name="end" type="date" value="${e?.end || e?.start || keyDate(state.anchor)}"><span class="field-help">Für eintägige Termine gleich dem Startdatum.</span></div><div class="field"><label for="f-start-time">Beginn <span class="req">*</span></label><input id="f-start-time" name="startTime" type="time" required value="${e?.startTime || '09:00'}"></div><div class="field"><label for="f-end-time">Ende <span class="req">*</span></label><input id="f-end-time" name="endTime" type="time" required value="${e?.endTime || '12:00'}"></div><div class="field"><label for="f-resource">Ressource</label><select id="f-resource" name="resource"><option ${e?.resource==='Essen-Wissen Bus'?'selected':''}>Essen-Wissen Bus</option><option ${e?.resource==='Stiftungsküche'?'selected':''}>Stiftungsküche</option><option ${e?.resource==='Beide Ressourcen'?'selected':''}>Beide Ressourcen</option><option ${e?.resource==='Keine feste Ressource'?'selected':''}>Keine feste Ressource</option></select></div><div class="field"><label for="f-visibility">Sichtbarkeit</label><select id="f-visibility" name="visibility"><option ${e?.visibility==='öffentlich'?'selected':''}>öffentlich</option><option ${e?.visibility==='teilweise öffentlich'?'selected':''}>teilweise öffentlich</option><option ${e?.visibility==='intern'?'selected':''}>intern</option></select></div><div class="field"><label for="f-repeat">Wiederholung</label><select id="f-repeat" name="repeat"><option value="none">Keine Wiederholung</option><option value="weekly">Wöchentlich</option><option value="monthly">Monatlich</option><option value="yearly">Jährlich</option></select></div><div class="field"><label for="f-repeat-until">Wiederholung bis</label><input id="f-repeat-until" name="repeatUntil" type="date"><span class="field-help">Optional – erzeugt Demotermine bis zu diesem Datum.</span></div><div class="form-section-label">Einrichtung & Ort</div><div class="field full"><label for="f-institution">Begünstigte Einrichtung <span class="req">*</span></label><input id="f-institution" name="institution" required value="${esc(e?.institution || '')}" placeholder="Name der Einrichtung"></div><div class="field"><label for="f-institution-type">Einrichtungstyp</label><select id="f-institution-type" name="institutionType">${['Kindertagesstätte','Grundschule','weiterführende Schule','Hort','Jugendfreizeiteinrichtung','Familienzentrum','soziale Einrichtung','Unternehmen','öffentliche Veranstaltung','sonstige Einrichtung'].map(s=>`<option ${e?.institutionType===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="f-state">Bundesland</label><select id="f-state" name="state">${['Berlin','Brandenburg','Sachsen','Sachsen-Anhalt','Thüringen','Mecklenburg-Vorpommern'].map(s=>`<option ${e?.state===s?'selected':''}>${s}</option>`).join('')}</select></div><div class="field"><label for="f-postal">Postleitzahl</label><input id="f-postal" name="postal" value="${esc(e?.postal || '')}" inputmode="numeric"></div><div class="field"><label for="f-city">Ort</label><input id="f-city" name="city" value="${esc(e?.city || '')}"></div><div class="field"><label for="f-street">Straße</label><input id="f-street" name="street" value="${esc(e?.street || '')}"></div><div class="field"><label for="f-house">Hausnummer</label><input id="f-house" name="house" value="${esc(e?.house || '')}"></div><div class="field full"><label for="f-building">Gebäude, Raum oder Schulhof</label><input id="f-building" name="building" value="${esc(e?.building || '')}"></div><div class="form-section-label">Inhalt & Kontakt</div><div class="field"><label for="f-topic">Thema / Modul</label><input id="f-topic" name="topic" value="${esc(e?.topic || '')}"></div><div class="field"><label for="f-participants">Teilnehmende</label><input id="f-participants" name="participants" type="number" min="0" value="${e?.participants || 0}"></div><div class="field full"><label for="f-audience">Zielgruppe / Klassenstufe</label><input id="f-audience" name="audience" value="${esc(e?.audience || '')}"></div><div class="field full"><label for="f-description">Kurzbeschreibung</label><textarea id="f-description" name="description">${esc(e?.description || '')}</textarea></div><div class="field full"><label for="f-public-description">Öffentliche Beschreibung</label><textarea id="f-public-description" name="publicDescription">${esc(e?.publicDescription || '')}</textarea><span class="field-help">Diese Fassung erscheint in der öffentlichen Ansicht. Keine Namen oder Kontaktdaten eintragen.</span></div><div class="field"><label for="f-contact-first">Ansprechpartner Vorname</label><input id="f-contact-first" name="contactFirst" value="${esc(e?.contact.first || '')}"></div><div class="field"><label for="f-contact-last">Ansprechpartner Nachname</label><input id="f-contact-last" name="contactLast" value="${esc(e?.contact.last || '')}"></div><div class="field"><label for="f-contact-role">Funktion</label><input id="f-contact-role" name="contactRole" value="${esc(e?.contact.role || '')}"></div><div class="field"><label for="f-contact-company">Einrichtung / Unternehmen</label><input id="f-contact-company" name="contactCompany" value="${esc(e?.contact.company || '')}"></div><div class="field"><label for="f-phone">Telefon</label><input id="f-phone" name="phone" type="tel" value="${esc(e?.contact.phone || '')}"></div><div class="field"><label for="f-mobile">Mobiltelefon</label><input id="f-mobile" name="mobile" type="tel" value="${esc(e?.contact.mobile || '')}"></div><div class="field"><label for="f-email">E-Mail</label><input id="f-email" name="email" type="email" value="${esc(e?.contact.email || '')}"></div><div class="field full"><label for="f-notes">Interne Notizen</label><textarea id="f-notes" name="internalNotes">${esc(e?.internalNotes || '')}</textarea><span class="field-help">Nur in der internen Planung sichtbar.</span></div><div id="conflict-alert" class="conflict-alert hidden">${icon('alert')}<div><strong>Ressource bereits belegt</strong><span id="conflict-text">Der Zeitraum überschneidet sich mit einem bestehenden Termin.</span></div></div></div><div class="modal-actions"><button type="button" class="secondary-btn" id="cancel-modal">Abbrechen</button><button type="submit" class="primary-btn">${icon('check')} ${e && !copy ? 'Änderungen speichern' : 'Termin anlegen'}</button></div></form></div></div>`;
        document.getElementById('close-modal').addEventListener('click', closeModal);
        document.getElementById('cancel-modal').addEventListener('click', closeModal);
        document.getElementById('modal-backdrop').addEventListener('click', e2 => { if(e2.target.id==='modal-backdrop') closeModal(); });
        document.querySelectorAll('#event-form input, #event-form select').forEach(el=>el.addEventListener('input', checkFormConflict));
        document.getElementById('event-form').addEventListener('submit', saveForm);
        checkFormConflict();
      }
      function closeModal() { state.modal=null; document.getElementById('modal-host').innerHTML=''; }
      function formData() { const f = new FormData(document.getElementById('event-form')); return Object.fromEntries(f.entries()); }
      function resourceMatches(resource, eventResource) { return resource === 'Beide Ressourcen' || eventResource === 'Beide Ressourcen' || resource === eventResource; }
      function overlaps(aStart,aEnd,bStart,bEnd) { return aStart <= bEnd && bStart <= aEnd; }
      function findConflict(data) {
        if (!data.resource || data.resource === 'Keine feste Ressource') return null;
        const current = state.editingId;
        return state.events.find(e => e.id !== current && resourceMatches(data.resource,e.resource) && overlaps(data.start || '', data.end || data.start || '', e.start, e.end));
      }
      function checkFormConflict() {
        const alert = document.getElementById('conflict-alert'); if (!alert) return;
        const data = formData(), conflict = findConflict(data);
        alert.classList.toggle('hidden', !conflict);
        if (conflict) document.getElementById('conflict-text').textContent = `${conflict.title} belegt ${conflict.resource} am ${formatDate(conflict.start)} (${conflict.startTime}–${conflict.endTime} Uhr). Bitte Zeitraum oder Ressource anpassen.`;
      }
      function addMonths(date, amount) { const d=new Date(date); d.setMonth(d.getMonth()+amount); return d; }
      function addYears(date, amount) { const d=new Date(date); d.setFullYear(d.getFullYear()+amount); return d; }
      function saveForm(ev) {
        ev.preventDefault(); const data=formData();
        if (data.end < data.start) { showToast('Das Enddatum darf nicht vor dem Startdatum liegen.'); return; }
        if (data.endTime <= data.startTime && data.start === data.end) { showToast('Die Endzeit muss nach der Beginnzeit liegen.'); return; }
        const conflict=findConflict(data); if(conflict){ checkFormConflict(); showToast('Doppelbuchung verhindert: Bitte Ressource oder Zeitpunkt ändern.'); return; }
        const editing = state.editingId ? state.events.find(e=>e.id===state.editingId) : null;
        const base = { id: editing ? editing.id : 'user-'+Date.now(), title:data.title, publicTitle:data.publicDescription || data.title, type:data.type, status:data.status, start:data.start, end:data.end || data.start, startTime:data.startTime, endTime:data.endTime, institution:data.institution, institutionType:data.institutionType, state:data.state, postal:data.postal, city:data.city, street:data.street, house:data.house, district:'', building:data.building, topic:data.topic, participants:Number(data.participants||0), audience:data.audience, description:data.description || '', publicDescription:data.publicDescription || data.title, contact:{first:data.contactFirst||'',last:data.contactLast||'',role:data.contactRole||'',company:data.contactCompany||data.institution,phone:data.phone||'',mobile:data.mobile||'',email:data.email||''}, resource:data.resource, visibility:data.visibility, internalNotes:data.internalNotes||'', creator:'Diether E.', changed:'gerade eben' };
        if(editing){ Object.assign(editing,base); } else {
          state.events.push(base);
          if(data.repeat !== 'none' && data.repeatUntil){ let cursor=parseDate(data.start), until=parseDate(data.repeatUntil), count=0; while(count<52){ cursor = data.repeat==='weekly' ? addDays(cursor,7) : data.repeat==='monthly' ? addMonths(cursor,1) : addYears(cursor,1); if(cursor>until) break; const copy={...base,id:'user-'+Date.now()+'-'+count,start:keyDate(cursor),end:keyDate(cursor),title:base.title+' · Serie',publicTitle:base.publicTitle}; const c=findConflict({...data,start:copy.start,end:copy.end}); if(!c) state.events.push(copy); count++; } }
        }
        closeModal(); renderAll(); state.selectedId=base.id; renderDrawer(); showToast(editing ? 'Änderungen gespeichert.' : 'Termin angelegt.');
      }

      function exportICS(event) {
        const dt = (date,time) => date.replaceAll('-','')+'T'+time.replace(':','')+'00';
        const ics=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Essen-Wissen//Kalender//DE','CALSCALE:GREGORIAN','BEGIN:VEVENT','UID:'+event.id+'@essen-wissen.demo','DTSTAMP:20260831T090000Z','DTSTART;TZID=Europe/Berlin:'+dt(event.start,event.startTime),'DTEND;TZID=Europe/Berlin:'+dt(event.end,event.endTime),'SUMMARY:'+icsEscape(publicTitle(event)),'LOCATION:'+icsEscape(`${event.street} ${event.house}, ${event.postal} ${event.city}`),'DESCRIPTION:'+icsEscape(event.publicDescription || event.description),'END:VEVENT','END:VCALENDAR'].join('\r\n');
        downloadFile('essen-wissen-termin.ics', ics, 'text/calendar;charset=utf-8'); showToast('ICS-Datei wurde erstellt.');
      }
      function icsEscape(v){return String(v||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\n/g,'\\n');}
      function downloadFile(name, content, type){ const blob=new Blob([content],{type}); const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=name; a.click(); setTimeout(()=>URL.revokeObjectURL(url),500); }
      function showToast(message){ state.toast=message; const host=document.getElementById('toast-host'); if(!host)return; host.innerHTML=`<div class="toast">${icon('check')} ${esc(message)}</div>`; setTimeout(()=>{ if(state.toast===message){ state.toast=''; host.innerHTML=''; } },3000); }

      renderShell();
    })();
  </script>
