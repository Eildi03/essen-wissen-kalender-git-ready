<div id="login">
  <h2>Anmeldung</h2>
  <form id="login-form">
    <label>
      E-Mail
      <input type="email" id="login-email" required autocomplete="email" />
    </label>
    <label>
      Passwort
      <input type="password" id="login-password" required autocomplete="current-password" />
    </label>
    <button type="submit">Anmelden</button>
  </form>
  <div id="login-status"></div>
</div>
