services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: essen_wissen_test
      POSTGRES_USER: essen_wissen_admin
      POSTGRES_PASSWORD: admin_pw
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - postgres-test-data:/var/lib/postgresql/data
      - ./api/db/migrations/001_baseline.sql:/docker-entrypoint-initdb.d/001-baseline.sql:ro
      - ./api/db/migrations/002_add_sessions_table.sql:/docker-entrypoint-initdb.d/002-sessions.sql:ro
      - ./api/db/migrations/003_add_trgm_indexes.sql:/docker-entrypoint-initdb.d/003-trgm.sql:ro
      - ./api/db/migrations/004_add_roles.sql:/docker-entrypoint-initdb.d/004-roles.sql:ro
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U essen_wissen_admin -d essen_wissen_test"]
      interval: 5s
      timeout: 5s
      retries: 10

  api-test:
    build:
      context: ./api
      target: test
    environment:
      NODE_ENV: test
      DATABASE_URL: postgres://essen_wissen_admin:admin_pw@postgres-test:5432/essen_wissen_test
      JWT_SECRET: test-secret
    depends_on:
      postgres-test:
        condition: service_healthy
    networks: [backend]
    command: ["npm", "run", "test:integration"]

networks:
  backend:
    driver: bridge

volumes:
  postgres-test-data: